# Cross-Origin-Resource-Policy（CORP）按请求类型自动切换
#
# - 被 iframe 嵌入（Sec-Fetch-Dest: iframe）：cross-origin
#   允许父页面（如 sub2api 面板）跨源引用资源
# - 顶层文档 / fetch / XHR：same-origin
#   阻止跨源标签直接 fetch 资源（防侧信道）
#
# 文件名以 00- 前缀，保证在 default.conf 之前加载，
# 使 $cross_origin_resource_policy 变量在 server 块中可用。

map $http_sec_fetch_dest $cross_origin_resource_policy {
    iframe "cross-origin";
    default "same-origin";
}
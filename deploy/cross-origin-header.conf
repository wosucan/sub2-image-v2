# Cross-Origin-Resource-Policy（CORP）响应头
#
# 由 /etc/nginx/conf.d/00-corp-map.conf 中的 map 计算：
# - 被 iframe 嵌入（Sec-Fetch-Dest: iframe）→ cross-origin
#   允许父页面（如 sub2api 面板）跨源引用资源，避免 Chrome 96+ 的拦截
# - 顶层文档 / fetch / XHR → same-origin
#   阻止跨源标签直接 fetch 资源（防侧信道）
#
# 此文件不在 envsubst 处理范围（不是 *.template），
# 因此 $cross_origin_resource_policy 字面量会被 nginx 解析为 map 变量。
add_header Cross-Origin-Resource-Policy $cross_origin_resource_policy always;